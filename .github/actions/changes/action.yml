name: "Changes"
description: "What a run changed, per feature of the repo's own spec, as JSON: {\"<feature>\": \"<value>\"}"

# The features and their rules are the calling repo's spec, .github/changes.yml
# by default, so this checks out nothing of its own: the job's checkout is
# where the spec is read from. How a spec matches: parseSpec in detect.ts.
#
#   outputs:
#     gtm: ${{ fromJSON(steps.changes.outputs.changes)['site-gtm'] }}

inputs:
  spec:
    description: "The spec, relative to the repo root"
    default: .github/changes.yml
  token:
    description: "Reads the PR's files, or the pushed commits"
    default: ${{ github.token }}

outputs:
  changes:
    description: "Each feature's value, `none` when nothing it watches changed, `all` on a hand-started run"
    value: ${{ steps.detect.outputs.changes }}

runs:
  using: composite
  steps:
    - name: "Set up Bun"
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: ${{ github.action_path }}/../package.json
    - name: "Install"
      shell: bash
      working-directory: ${{ github.action_path }}/..
      run: bun install --frozen-lockfile --production
    - name: "Detect changes"
      id: detect
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        SPEC: ${{ inputs.spec }}
      run: bun "$GITHUB_ACTION_PATH/detect.ts" | tee -a "$GITHUB_OUTPUT"
