version: 2

# cooldown: wait 72h (3 days) after a release before opening version-update PRs,
# so a compromised/broken fresh release has time to be pulled. Version updates
# only — security updates ignore cooldown.

updates:
  ## ci
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3

  ## dashboard
  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3

  - package-ecosystem: docker
    directory: /dashboard/docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3

  ## ip service
  - package-ecosystem: npm
    directory: /ip-service
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3

  - package-ecosystem: docker
    directory: /ip-service/docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3

  ## compose services
  - package-ecosystem: docker-compose
    directory: /forgejo
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3

  - package-ecosystem: docker-compose
    directory: /readeck
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3

  - package-ecosystem: docker-compose
    directory: /database
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3

  - package-ecosystem: docker-compose
    directory: /gotenberg
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3

  ## dockerfile services
  - package-ecosystem: docker
    directory: /github-runner
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
