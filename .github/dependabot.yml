    cooldown:
      default-days: 7
    commit-message:
      prefix: deps

  - package-ecosystem: docker-compose
    directory: /forgejo-runner
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      all:
        patterns:
          - "*"
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps

  - package-ecosystem: docker-compose
    directory: /archivebox
    schedule:
      interval: weekly
