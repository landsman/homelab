version: 2

updates:
  ## ci
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  ## dashboard
  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: docker
    directory: /dashboard/docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  ## ip service
  - package-ecosystem: npm
    directory: /ip-service
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: docker
    directory: /ip-service/docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  ## compose services
  - package-ecosystem: docker-compose
    directory: /forgejo
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker-compose
    directory: /readeck
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker-compose
    directory: /database
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker-compose
    directory: /gotenberg
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  ## dockerfile services
  - package-ecosystem: docker
    directory: /github-runner
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
