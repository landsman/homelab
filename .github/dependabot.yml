version: 2

# cooldown: wait 72h (3 days) after a release before opening version-update PRs,
# so a compromised/broken fresh release has time to be pulled. Version updates
# only — security updates ignore cooldown.

updates:
  ## ci
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3

  ## dashboard
  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3

  - package-ecosystem: docker
    directory: /dashboard/docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3

  ## ip service
  - package-ecosystem: npm
    directory: /ip-service
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3

  - package-ecosystem: docker
    directory: /ip-service/docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3

  ## compose services
  - package-ecosystem: docker-compose
    directory: /forgejo
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3

  - package-ecosystem: docker-compose
    directory: /readeck
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3

  - package-ecosystem: docker-compose
    directory: /database
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3

  - package-ecosystem: docker-compose
    directory: /gotenberg
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3

  ## dockerfile services
  - package-ecosystem: docker
    directory: /github-runner
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3

  ## terraform
  # One entry per root module, because that is the unit dependabot resolves: it
  # reads the required_providers of the directory it is pointed at and nothing
  # below it. Both pin with `~>`, so a PR shows up when the constraint stops
  # covering the newest release — cloudflare 5.x here, 6.0 when it lands.
  #
  # Providers only. `required_version = ">= 1.15"`, the terraform binary itself,
  # is not something this ecosystem touches; that stays a hand edit.
  - package-ecosystem: terraform
    directory: /insuit/infra
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3

  - package-ecosystem: terraform
    directory: /pollos/infra
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
