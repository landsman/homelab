name: "actions ci"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/actions/**'
      - '.github/changes.yml'
      - '.github/workflows/actions-ci.yml'
      - '!**/*.md'

# A new push to the same PR cancels the run still going for the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The scripts the shared actions run: what counts as a change, per feature.
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .github/actions
    steps:
      - name: "Check out"
        uses: actions/checkout@v7
      - name: "Set up Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .github/actions/package.json
      - name: "Install"
        run: make install
      - name: "Quality checks"
        run: make qa
