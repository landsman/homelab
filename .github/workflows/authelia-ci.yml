name: "authelia ci"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'authelia/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - '!**/*.md'

# A new push to the same PR cancels the run still going for the previous one.
# Everything else runs to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: authelia

    steps:
      - uses: actions/checkout@v7

      # The version in the root package.json's packageManager, the one the Pi runs.
      - name: "Set up Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # user.ts talks to the Authelia and Forgejo containers; the test stubs
      # docker on PATH, so this runs on a cloud runner.
      - name: "Type-check and test user.ts"
        run: make test
