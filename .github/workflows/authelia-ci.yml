name: "authelia ci"

on:
  workflow_dispatch:
  pull_request:
    # The scripts and the tooling make test runs them with, so a Dependabot bump of oxlint,
    # oxfmt or the Bun types is checked too. Config, compose and docs have nothing here to break.
    paths:
      - 'authelia/cli/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - '.oxlintrc.json'
      - '.oxfmtrc.json'
      - 'Makefile'
      - '.github/workflows/authelia-ci.yml'

# A new push to the same PR cancels the run still going for the previous one.
# Everything else runs to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: authelia

    steps:
      - uses: actions/checkout@v7

      # The version in the root package.json's packageManager, the one the Pi runs.
      - name: "Set up Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # cli/user.ts talks to the Authelia and Forgejo containers; the test stubs
      # docker on PATH, so this runs on a cloud runner.
      - name: "Format-check, lint, type-check and test the cli scripts"
        run: make test
