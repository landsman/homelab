name: "dashboard ci"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'dashboard/**'
      - '!**/*.md'

jobs:
  tests:
    # Self-hosted runner on Raspberry Pi 5 — see ./github-runner/README.md
    #runs-on: [self-hosted, pi5]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: "Install dependencies"
        run: make install

      - name: "Install shellcheck"
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi
        working-directory: .

      - name: "Format check"
        run: make qa

      - name: "Build"
        run: make build

      # Keyed on the lockfile: only a dependency bump (which may move the
      # Playwright version) has to re-download the ~90 MB browser.
      - name: "Cache Playwright browser"
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('dashboard/package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      # Still runs on a cache hit — the browser is skipped, the apt system deps
      # are not cached and have to be installed either way.
      - name: "Install Playwright browser"
        run: npx playwright install --with-deps chromium

      - name: "End-to-end tests"
        run: npm run test:e2e

      - name: "Feature tests"
        run: npm run test:bdd

  security:
    uses: landsman/config/.github/workflows/semgrep.yml@main
    with:
      packs: p/secrets p/typescript p/dockerfile
      path: dashboard

  dockerfile:
    uses: landsman/config/.github/workflows/dockerfile.yml@main
    with:
      dockerfile: dashboard/docker/Dockerfile
      # the apk upgrade above only exists in the built image, not on the registry
      build: true
      context: dashboard
