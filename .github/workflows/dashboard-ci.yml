name: "dashboard ci"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'dashboard/**'
      - '!**/*.md'

jobs:
  tests:
    # Self-hosted runner on Raspberry Pi 5 — see ./github-runner/README.md
    #runs-on: [self-hosted, pi5]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: "Install dependencies"
        run: make install

      - name: "Install shellcheck"
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi
        working-directory: .

      - name: "Format check"
        run: make qa

      - name: "Build"
        run: make build

  # The scan lives in landsman/config and is called, not copied — one place to
  # change the scanner, the image or a default pack for every repo of mine.
  # Its own job so a finding reads as a finding rather than as a broken build.
  #
  # missing-user is excluded, and it is a real finding rather than a wrong rule:
  # docker/Dockerfile ends on nginx:alpine with no USER, so the container runs as
  # root. Fixing it properly is nginxinc/nginx-unprivileged, which serves on 8080
  # instead of 80 and so is a change to whatever runs the image, not to this file
  # — more than adding a scanner should quietly drag in. Carried deliberately so
  # the other 117 rules can start reporting today; drop the exclude with that
  # switch.
  security:
    uses: landsman/config/.github/workflows/semgrep.yml@main
    with:
      packs: p/secrets p/typescript p/dockerfile
      path: dashboard
      exclude-rules: dockerfile.security.missing-user.missing-user
