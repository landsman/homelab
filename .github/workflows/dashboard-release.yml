name: "dashboard cd"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '!**/*.md'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/homelab-dashboard

jobs:
  docker:
    # GitHub's free arm64 runner: the job only builds and pushes to GHCR, so it
    # needs no route into the home network — and the pi5 runner being down must
    # not hold up a release. Native arm64, no emulation.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v7

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v4

      - name: "Log in to GHCR"
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Build and push"
        run: make ci-release
        env:
          REGISTRY_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          GIT_SHA: ${{ github.sha }}
