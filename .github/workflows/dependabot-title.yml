name: "dependabot title"

# Dependabot titles a group PR "bump the all group with 3 updates", and nothing in
# dependabot.yml can change that text. This keeps its `deps(<service>)` prefix and
# replaces the rest with the dependencies it actually bumped.
#
# `pull_request`, not `pull_request_target`: a Dependabot run gets a read-only token
# by default, but `permissions:` may raise it, and that avoids running with the
# base repo's secrets.

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: "shellcheck + script tests"
        run: shellcheck .github/*.sh && for t in .github/*.test.sh; do "$t"; done

  retitle:
    needs: test
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - id: meta
        uses: dependabot/fetch-metadata@v3
      - name: "rewrite the title"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          NAMES: ${{ steps.meta.outputs.dependency-names }}
          FROM: ${{ steps.meta.outputs.previous-version }}
          TO: ${{ steps.meta.outputs.new-version }}
        run: gh pr edit "$PR" --title "$(.github/dependabot-title.sh "$TITLE" "$NAMES" "$FROM" "$TO")"
