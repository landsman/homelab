name: "github runner ci"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'github-runner/**'
      - '!**/*.md'

# A new push to the same PR cancels the run still going for the previous one.
# Everything else runs to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # intentionally run this one job in cloud runner
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: github-runner

    steps:
      - uses: actions/checkout@v7

      - name: "try to build docker image"
        run: make build

  dockerfile:
    uses: landsman/config/.github/workflows/dockerfile.yml@main
    with:
      dockerfile: github-runner/Dockerfile
      ignorefile: github-runner/.trivyignore

  security:
    uses: landsman/config/.github/workflows/semgrep.yml@main
    with:
      packs: p/secrets
      path: github-runner
