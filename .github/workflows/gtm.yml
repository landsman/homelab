name: "GTM as code"

# A site's analytics.yaml (gtm-as-code) against its live GTM container and GA4
# property: `plan` comments the diff on the PR, `deploy` applies and publishes
# it. The site needs @stackmade/gtm-as-code in its devDependencies and a
# bun.lock. Skipped while any of the three ids is empty.
#
#   gtm:
#     uses: landsman/homelab/.github/workflows/gtm.yml@<sha>
#     permissions: { contents: read, id-token: write, pull-requests: write }
#     with:
#       command: plan            # or deploy, with environment: production
#       working-directory: site
#       gtm-account-id: ${{ vars.GTM_ACCOUNT_ID }}
#       gtm-container-id: ${{ vars.GTM_CONTAINER_ID }}
#       ga4-property-id: ${{ vars.GA4_PROPERTY_ID }}
#     secrets:
#       workload-identity-provider: ${{ secrets.GCP_GTM_WIF_PROVIDER }}
#       service-account: ${{ secrets.GCP_GTM_PLAN_SA_EMAIL }}
#
# Plan with a read-only account: a PR can change what this job runs.

on:
  workflow_call:
    inputs:
      command:
        description: "plan (comment on the PR) or deploy (apply and publish)"
        type: string
        required: true
      working-directory:
        description: "The site's folder: package.json, bun.lock, the config"
        type: string
        default: "."
      config:
        description: "The config, relative to working-directory"
        type: string
        default: analytics/analytics.yaml
      environment:
        description: "The deployment environment, for deploy"
        type: string
        default: ""
      gtm-account-id:
        type: string
        required: true
      gtm-container-id:
        type: string
        required: true
      ga4-property-id:
        type: string
        required: true
    secrets:
      workload-identity-provider:
        required: true
      service-account:
        required: true

jobs:
  gtm:
    if: inputs.gtm-account-id != '' && inputs.gtm-container-id != '' && inputs.ga4-property-id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    # gtm-code's lock is a file on the runner, so two deploys in a row would
    # apply to the same workspace at once without this. A plan is cancelled by
    # the next push to its PR.
    concurrency:
      group: gtm-${{ inputs.working-directory }}-${{ inputs.command == 'deploy' && 'deploy' || github.ref }}
      cancel-in-progress: ${{ inputs.command == 'plan' }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      GTM_ACCOUNT_ID: ${{ inputs.gtm-account-id }}
      GTM_CONTAINER_ID: ${{ inputs.gtm-container-id }}
      GA4_PROPERTY_ID: ${{ inputs.ga4-property-id }}
      CONFIG: ${{ inputs.config }}
    steps:
      - name: "Check out"
        uses: actions/checkout@v7
      - name: "Set up Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ${{ inputs.working-directory }}/package.json
      - name: "Install"
        run: bun install --frozen-lockfile
      - name: "Authenticate to Google Cloud"
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.workload-identity-provider }}
          service_account: ${{ secrets.service-account }}
      # --bun: the CLI wants Node 22, and the runner's Node may be older.
      - name: "Validate"
        run: bunx --bun gtm-code validate -c "$CONFIG"

      # gtm-code plan exits 2 when there is something to apply, the way
      # `terraform plan -detailed-exitcode` does. Only 1 is a failure.
      # Markdown names resources by their keys in the config, not by Google
      # ids, so the comment carries none.
      - name: "Plan"
        if: inputs.command == 'plan'
        run: bunx --bun gtm-code plan -c "$CONFIG" --format markdown >"$RUNNER_TEMP/gtm-plan.md" || [ $? -eq 2 ]
      - name: "Comment the plan"
        if: inputs.command == 'plan'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: gtm-plan-${{ inputs.working-directory }}
          path: ${{ runner.temp }}/gtm-plan.md

      - name: "Check for changes"
        id: changes
        if: inputs.command == 'deploy'
        run: |
          code=0; bunx --bun gtm-code plan -c "$CONFIG" || code=$?
          case $code in 0) echo any=false ;; 2) echo any=true ;; *) exit 1 ;; esac >>"$GITHUB_OUTPUT"
      # apply only stages into the workspace; nothing is live until a publish.
      - name: "Apply and publish"
        if: steps.changes.outputs.any == 'true'
        run: |
          bunx --bun gtm-code apply -c "$CONFIG" --auto-approve
          bunx --bun gtm-code publish -c "$CONFIG"
      # apply records the GA4 resources it creates in .analytics/state.json,
      # the only record that they are ours. Uncommitted, the next run creates
      # them again.
      - name: "Check the GA4 state is committed"
        if: steps.changes.outputs.any == 'true'
        run: |
          test -z "$(git status --porcelain .analytics)" ||
            { echo "::error::.analytics/state.json changed, commit it from the gtm-state artifact"; exit 1; }
      - name: "Keep the GA4 state"
        if: failure() && steps.changes.outputs.any == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: gtm-state
          path: ${{ inputs.working-directory }}/.analytics/state.json
          if-no-files-found: ignore
