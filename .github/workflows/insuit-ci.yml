name: "insuit.cz ci"

on:
  pull_request:
    paths:
      - 'insuit/**'
      - '.github/workflows/insuit-ci.yml'
      - '!**/*.md'
  push:
    branches: [main]
    paths:
      - 'insuit/**'
      - '.github/workflows/insuit-ci.yml'
      - '!**/*.md'
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      og: ${{ steps.filter.outputs.og }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            og:
              - 'insuit/og/**'
              - 'insuit/Makefile'

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: insuit
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: "Install JS deps"
        run: make install

      - name: "Quality checks (oxfmt + oxlint)"
        run: make qa

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: insuit/infra
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - name: "Format check + validate"
        run: make ci

  # Render the OG card when its source changes, so a broken card is caught
  # before merge. Uploads the PNG as an artifact you can download from the PR
  # to eyeball it. The deploy renders its own copy — this only validates.
  og:
    needs: changes
    if: needs.changes.outputs.og == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: insuit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: "Install (deps, font symlinks)"
        run: make install
      - name: "Chromium + system deps"
        run: npx playwright install --with-deps chromium
      - name: "Render OG card"
        run: make og
      - name: "Upload preview"
        uses: actions/upload-artifact@v4
        with:
          name: og-preview
          path: insuit/site/assets/icons/og-image.png
          retention-days: 7

  # The scan lives in landsman/config and is called, not copied — one place to
  # change the scanner, the image or a default pack for every repo of mine.
  # Its own job so a finding reads as a finding rather than as a broken build.
  security:
    uses: landsman/config/.github/workflows/semgrep.yml@main
    with:
      packs: p/secrets p/javascript p/terraform
      path: insuit
