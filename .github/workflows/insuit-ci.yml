name: "insuit.cz ci"

on:
  pull_request:
    paths:
      - 'insuit/**'
      - '.github/workflows/insuit-ci.yml'
      - '!**/*.md'
      # cv.md is the CV page's source, not docs — re-included after the skip.
      - 'insuit/src/features/cv/cv.md'
  push:
    branches: [main]
    paths:
      - 'insuit/**'
      - '.github/workflows/insuit-ci.yml'
      - '!**/*.md'
      # cv.md is the CV page's source, not docs — re-included after the skip.
      - 'insuit/src/features/cv/cv.md'
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      og: ${{ steps.filter.outputs.og }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            og:
              - 'insuit/og/**'
              - 'insuit/Makefile'

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: insuit
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 26, not 25: Cucumber runs on 22 || 24 || >=26 and refuses the rest
          node-version: 26
          cache: npm
          cache-dependency-path: insuit/package-lock.json

      - name: "Install dependencies"
        run: make install

      - name: "Quality checks (images, typecheck, oxfmt, oxlint, unit tests)"
        run: make qa

      # Builds the CV from cv.md too, and fails if one of its links has no
      # short link in links/_redirects.
      - name: "Build"
        run: make build

      # Keyed on the lockfile: only a dependency bump (which may move the
      # Playwright version) has to re-download the ~90 MB browser.
      - name: "Cache Playwright browser"
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('insuit/package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      # Still runs on a cache hit — the browser is skipped, the apt system deps
      # are not cached and have to be installed either way.
      - name: "Install Playwright browser"
        run: make e2e-deps

      - name: "End-to-end tests"
        run: make e2e

      - name: "Feature tests"
        run: make bdd

  # Cloudflare builds no previews on its own — the Pages project is fed by
  # direct upload, not connected to git. So every PR uploads its build under
  # its branch name and links the alias back on the PR. Fork and Dependabot
  # PRs get no secrets, so they are skipped rather than failed.
  preview:
    needs: site
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # The environment the deploy reads the same token from.
    environment: production
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: insuit/package-lock.json
      # No analytics token: a visit to a preview is not a visit to the site.
      - name: "Build the site"
        working-directory: insuit
        env:
          CONTACT_EMAIL: ${{ vars.INSUIT_CONTACT_EMAIL }}
        run: make install build
      - uses: cloudflare/wrangler-action@v4
        id: deploy
        with:
          apiToken: ${{ secrets.INSUIT_CZ_CF_API_TOKEN }}
          accountId: ${{ vars.INSUIT_CZ_CF_ACCOUNT_ID }}
          command: pages deploy insuit/dist --project-name=insuit-cz --branch=${{ github.head_ref }}
      - name: "Link the preview on the PR"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
        run: 'gh pr comment "$PR" --edit-last --create-if-none --body "insuit.cz preview: $URL"'

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: insuit/infra
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - name: "Format check + validate"
        run: make ci

  # Render the OG card when its source changes, so a broken card is caught
  # before merge. Uploads the PNG as an artifact you can download from the PR
  # to eyeball it. The deploy renders its own copy — this only validates.
  og:
    needs: changes
    if: needs.changes.outputs.og == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: insuit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: "Install (deps, font symlinks)"
        run: make install
      - name: "Chromium + system deps"
        run: make e2e-deps
      - name: "Render OG card"
        run: make og
      - name: "Upload preview"
        uses: actions/upload-artifact@v7
        with:
          name: og-preview
          path: insuit/public/assets/icons/og-image.png
          retention-days: 7

  # The scan lives in landsman/config and is called, not copied — one place to
  # change the scanner, the image or a default pack for every repo of mine.
  # Its own job so a finding reads as a finding rather than as a broken build.
  security:
    uses: landsman/config/.github/workflows/semgrep.yml@main
    with:
      packs: p/secrets p/typescript p/terraform
      path: insuit
