name: "insuit.cz ci"

on:
  pull_request:
    paths:
      - 'insuit/**'
      - '.github/workflows/insuit-ci.yml'
      - '!**/*.md'
      # content/ is what the site says, not docs — the CV's cv.md and the
      # blog's posts. Re-included after the skip.
      - 'insuit/content/**'
  push:
    branches: [main]
    paths:
      - 'insuit/**'
      - '.github/workflows/insuit-ci.yml'
      - '!**/*.md'
      # content/ is what the site says, not docs — the CV's cv.md and the
      # blog's posts. Re-included after the skip.
      - 'insuit/content/**'
  workflow_dispatch:

# A new push to the same PR cancels the run still going for the previous one,
# so the older commit can never finish last and overwrite the preview. On main
# every push still runs to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    runs-on: ubuntu-latest
    # A step that hangs fails the job here instead of holding a runner for
    # the six hours GitHub allows by default.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: insuit
    env:
      # The commit that was pushed. A PR is checked out as its merge commit,
      # which is what `git rev-parse HEAD` would otherwise put into the pages.
      COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7

      # The version in package.json's packageManager, the one the lockfile was
      # written by.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: insuit/package.json

      - name: "Install dependencies"
        run: make install

      - name: "Quality checks (images, typecheck, oxfmt, oxlint, unit tests)"
        run: make qa

      # Keyed on the lockfile: only a dependency bump (which may move the
      # Playwright version) has to re-download the ~90 MB browser.
      - name: "Cache Playwright browser"
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('insuit/bun.lock') }}
          restore-keys: ${{ runner.os }}-playwright-

      # The browser only, not `make e2e-deps`: that also installs its system
      # libraries through apt, which the hosted runner already has — and apt is
      # what hung this job for fourteen minutes when Ubuntu's mirror was down.
      - name: "Install Playwright browser"
        run: make browser

      # The link-preview card is not committed, so it is drawn here: the build
      # then carries it, and a PR's preview shows the card its pages point at.
      # It also catches a card that no longer renders before merge.
      - name: "Render the OG card"
        run: make og

      # A PR's build is uploaded as its preview, so the addresses its pages give
      # for themselves (og:url, the link-preview picture) point there, not at
      # the live site. Pages names the alias after the branch: lowercased,
      # anything but a letter or a digit turned into a dash, 28 characters.
      - name: "Aim the build at its preview address"
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
        run: echo "VITE_SITE_URL=https://$(printf %s "$BRANCH" | tr 'A-Z' 'a-z' | tr -c 'a-z0-9' '-' | cut -c1-28).insuit-preview.pages.dev" >> "$GITHUB_ENV"

      # Builds the site first and tests what was built: the prerendered pages,
      # served the way Pages serves them. The build fails if a CV link has no
      # short link in links/_redirects.
      - name: "End-to-end tests"
        run: make e2e

      # What was just tested is what the preview job uploads.
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: insuit/dist/client
          retention-days: 1

      - name: "Feature tests"
        run: make bdd

  # Cloudflare builds no previews on its own — the Pages project is fed by
  # direct upload, not connected to git. So every PR uploads its build under
  # its branch name and links the alias back on the PR. Fork and Dependabot
  # PRs get no secrets, so they are skipped rather than failed. A PR out of
  # `main` is skipped too: uploaded under that name it would be the live site.
  #
  # The job only uploads: the build comes from the `site` job, which holds no
  # token, so nothing a PR installs or runs executes beside the Cloudflare one.
  # That build has no analytics token and the placeholder contact address.
  # Whether the PR touches what the site serves. One that only changes
  # Terraform, tests, scripts or docs gets no preview: there is nothing new to
  # look at, and its URL would only repeat main.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v7
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: echo "app=$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only | insuit/scripts/app-changed.sh)" >> "$GITHUB_OUTPUT"

  preview:
    needs: [site, changes]
    if: |
      needs.changes.outputs.app == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      github.head_ref != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The environment the deploy reads the same token from.
    environment: production
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: insuit/dist/client
      - uses: cloudflare/wrangler-action@v4
        id: deploy
        with:
          apiToken: ${{ secrets.INSUIT_CZ_CF_API_TOKEN }}
          accountId: ${{ vars.INSUIT_CZ_CF_ACCOUNT_ID }}
          command: pages deploy insuit/dist/client --project-name=insuit-preview --branch=${{ github.head_ref }}
      - name: "Link the preview on the PR"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
          COMMIT: ${{ github.event.pull_request.head.sha }}
        run: insuit/scripts/preview-comment.sh post "$GITHUB_REPOSITORY" "$PR" "$URL" "$COMMIT"
      # The local preview the tests ran against is this repo's own reading of
      # Pages' rules (scripts/preview.ts). The same questions go to the real
      # thing here, so the two cannot drift apart unnoticed — after waiting
      # until the preview says it is this commit.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: insuit/package.json
      - name: "Does Pages answer the way the local preview does?"
        env:
          URL: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
          COMMIT: ${{ github.event.pull_request.head.sha }}
        run: bun insuit/scripts/check-pages.ts "$URL" "$COMMIT"

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: insuit/infra
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - name: "Format check + validate"
        run: make ci

  # The scan lives in landsman/config and is called, not copied — one place to
  # change the scanner, the image or a default pack for every repo of mine.
  # Its own job so a finding reads as a finding rather than as a broken build.
  security:
    uses: landsman/config/.github/workflows/semgrep.yml@main
    with:
      packs: p/secrets p/typescript p/terraform
      path: insuit
