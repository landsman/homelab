name: Deploy insuit.cz

on:
  push:
    branches: [main]
    paths:
      - 'insuit/**'
      - '.github/workflows/insuit-deploy.yml'
      - '!**/*.md'
      # cv.md is the CV page's source, not docs — re-included after the skip.
      - 'insuit/site/cv.md'
  workflow_dispatch:

jobs:
  infra:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: insuit/infra
    env:
      TF_VAR_cloudflare_api_token: ${{ secrets.INSUIT_CZ_CF_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.INSUIT_CZ_CF_ACCOUNT_ID }}
      # State lives in insuit's own R2 bucket, with a token scoped to it.
      AWS_ACCESS_KEY_ID: ${{ secrets.INSUIT_CZ_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.INSUIT_CZ_R2_SECRET_ACCESS_KEY }}
    outputs:
      analytics_token: ${{ steps.analytics.outputs.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          # The wrapper decorates stdout, which would corrupt the captured token.
          terraform_wrapper: false
      - run: terraform init -backend-config="endpoints={s3=\"https://${{ vars.INSUIT_CZ_CF_ACCOUNT_ID }}.r2.cloudflarestorage.com\"}"
      - run: terraform apply -auto-approve
      - id: analytics
        run: echo "token=$(terraform output -raw analytics_token)" >> "$GITHUB_OUTPUT"

  # Render the OG card and hand it to the deploy as an artifact — it isn't
  # committed. Regenerated each deploy (a static file that isn't in git can't be
  # gated on change, since the deploy always needs it).
  og:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: insuit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: "Install (deps, font symlinks, chromium)"
        run: make install
      - name: "Chromium system deps"
        run: npx playwright install --with-deps chromium
      - name: "Render OG card"
        run: make og
      - uses: actions/upload-artifact@v7
        with:
          name: og-image
          path: insuit/site/assets/icons/og-image.png
          retention-days: 1

  content:
    needs: [infra, og]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # cv.html is rendered from cv.md, never committed — build it before the
      # upload or /cv 404s. It also fails if a CV link has no short link.
      - name: "Render the CV page"
        working-directory: insuit
        run: npm ci --no-audit --no-fund && make cv
      # Values kept out of the repo; the pages carry placeholders until here.
      # The Web Analytics token lives in Terraform state, the contact address
      # in a repo variable so it isn't in a file scrapers can search.
      - name: "Fill in deploy-time values"
        env:
          TOKEN: ${{ needs.infra.outputs.analytics_token }}
          EMAIL: ${{ vars.INSUIT_CONTACT_EMAIL }}
        run: test -n "$TOKEN" && test -n "$EMAIL" && sed -i -e "s/__CF_BEACON_TOKEN__/$TOKEN/" -e "s/__CONTACT_EMAIL__/$EMAIL/" insuit/site/*.html
      - name: "Pull in the rendered OG card"
        uses: actions/download-artifact@v8
        with:
          name: og-image
          path: insuit/site/assets/icons
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.INSUIT_CZ_CF_API_TOKEN }}
          accountId: ${{ vars.INSUIT_CZ_CF_ACCOUNT_ID }}
          command: pages deploy insuit/site --project-name=insuit-cz --branch=main
      # link.insuit.cz: the hand-kept redirects the printed CV's QR codes point
      # at (insuit/links/).
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.INSUIT_CZ_CF_API_TOKEN }}
          accountId: ${{ vars.INSUIT_CZ_CF_ACCOUNT_ID }}
          command: pages deploy insuit/links --project-name=insuit-links --branch=main
