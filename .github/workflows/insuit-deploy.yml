name: Deploy insuit.cz

on:
  push:
    branches: [main]
    paths:
      - 'insuit/**'
      - '.github/workflows/insuit-deploy.yml'
      - '!**/*.md'
      # content/ is what the site says, not docs — the CV's cv.md and the
      # blog's posts. Re-included after the skip.
      - 'insuit/content/**'
  workflow_dispatch:

jobs:
  infra:
    runs-on: ubuntu-latest
    # A step that hangs fails the job here instead of holding a runner for
    # the six hours GitHub allows by default.
    timeout-minutes: 10
    environment: production
    defaults:
      run:
        working-directory: insuit/infra
    env:
      TF_VAR_cloudflare_api_token: ${{ secrets.INSUIT_CZ_CF_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.INSUIT_CZ_CF_ACCOUNT_ID }}
      TF_VAR_cloudflare_zone_id: ${{ vars.INSUIT_CZ_CF_ZONE_ID }}
      # State lives in insuit's own R2 bucket, with a token scoped to it.
      AWS_ACCESS_KEY_ID: ${{ secrets.INSUIT_CZ_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.INSUIT_CZ_R2_SECRET_ACCESS_KEY }}
    outputs:
      analytics_token: ${{ steps.analytics.outputs.token }}
    steps:
      - name: "Check out"
        uses: actions/checkout@v7
      - name: "Set up Terraform"
        uses: hashicorp/setup-terraform@v4
        with:
          # The wrapper decorates stdout, which would corrupt the captured token.
          terraform_wrapper: false
      - name: "Terraform init"
        env:
          ACCOUNT_ID: ${{ vars.INSUIT_CZ_CF_ACCOUNT_ID }}
        run: terraform init -backend-config="endpoints={s3=\"https://${ACCOUNT_ID}.r2.cloudflarestorage.com\"}"
      - name: "Terraform apply"
        run: terraform apply -auto-approve
      - name: "Read the analytics token"
        id: analytics
        run: echo "token=$(terraform output -raw analytics_token)" >> "$GITHUB_OUTPUT"

  # Render the OG card and hand it to the deploy as an artifact — it isn't
  # committed. Regenerated each deploy (a static file that isn't in git can't be
  # gated on change, since the deploy always needs it).
  og:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: insuit
    steps:
      - name: "Check out"
        uses: actions/checkout@v7
      # The version in package.json's packageManager, the one the lockfile was
      # written by.
      - name: "Set up Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: insuit/package.json
      - name: "Install"
        run: make install
      # `make og` fetches the browser itself. No system libraries through apt:
      # the hosted runner has them, and apt took most of this job's two minutes
      # on a day Ubuntu's mirror was failing.
      - name: "Render OG card"
        run: make og
      - name: "Upload the OG card"
        uses: actions/upload-artifact@v7
        with:
          name: og-image
          path: insuit/public/assets/icons/og-image.png
          retention-days: 1

  content:
    needs: [infra, og]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: "Check out"
        uses: actions/checkout@v7
      # The version in package.json's packageManager, the one the lockfile was
      # written by.
      - name: "Set up Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: insuit/package.json
      # Into public/ before the build, which copies it to dist/ with the rest.
      - name: "Download the OG card"
        uses: actions/download-artifact@v8
        with:
          name: og-image
          path: insuit/public/assets/icons
      # Values kept out of the repo are built into the site here. The Web
      # Analytics token lives in Terraform state, the contact address in a repo
      # variable so it isn't in a file scrapers can search. The build also
      # fails if a CV link has no short link.
      - name: "Build"
        working-directory: insuit
        env:
          VITE_CF_BEACON_TOKEN: ${{ needs.infra.outputs.analytics_token }}
          CONTACT_EMAIL: ${{ vars.INSUIT_CONTACT_EMAIL }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          test -n "$VITE_CF_BEACON_TOKEN" && test -n "$CONTACT_EMAIL"
          make install build
      - name: "Deploy www.insuit.cz"
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.INSUIT_CZ_CF_API_TOKEN }}
          accountId: ${{ vars.INSUIT_CZ_CF_ACCOUNT_ID }}
          command: pages deploy insuit/dist/client --project-name=insuit-cz --branch=main
      # The upload succeeding is not the site being live. This waits until
      # www.insuit.cz says it is this commit, then asks it what the tests asked
      # the local preview: the pages, the redirects, the 404, the caching.
      - name: "Check it is live"
        working-directory: insuit
        env:
          SMOKE_COMMIT: ${{ github.sha }}
        run: make smoke ARGS=--project=site
      # link.insuit.cz: the hand-kept redirects the printed CV's QR codes point
      # at (insuit/links/).
      - name: "Deploy link.insuit.cz"
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.INSUIT_CZ_CF_API_TOKEN }}
          accountId: ${{ vars.INSUIT_CZ_CF_ACCOUNT_ID }}
          command: pages deploy insuit/links --project-name=insuit-links --branch=main
      # The file can be right while the domain is not, so every code is asked of
      # link.insuit.cz itself.
      - name: "Do the short links redirect?"
        working-directory: insuit
        run: make smoke ARGS=--project=links
