name: "insuit.cz og image"

# Regenerates the Open Graph card only when its source changes, so it never
# runs on unrelated deploys. Renders og/og.html with headless Chromium in
# Docker (provider-independent, same as `make og`) and commits the fresh PNG
# back to the PR branch.
on:
  pull_request:
    paths:
      - 'insuit/og/**'

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: insuit
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # Creates the font symlink og/ needs (and installs deps).
      - name: "Set up (symlink font)"
        run: make install

      - name: "Render OG card (headless Chromium in Docker)"
        run: make og

      - name: "Commit if the card changed"
        run: |
          if git diff --quiet -- site/assets/icons/og-image.png; then
            echo "og-image.png unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/icons/og-image.png
          git commit -m "insuit.cz: regenerate og-image.png"
          git push
