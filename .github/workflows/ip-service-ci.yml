name: "ip service ci"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ip-service/**'
      - '!**/*.md'

jobs:
  dockerfile:
    uses: landsman/config/.github/workflows/dockerfile.yml@main
    with:
      dockerfile: ip-service/docker/Dockerfile
      # the apk upgrade in the Dockerfile only exists in the built image, never
      # on the registry copy of the FROM
      build: true
      context: ip-service
      # the bun runtime alone unpacks to ~150 MB, so the shared default is a
      # ceiling this cannot pass on any day; 200 leaves room for the app only
      max-size-mb: 200

  build:
    # Self-hosted runner on Raspberry Pi 5 — see ./github-runner/README.md
    #runs-on: [self-hosted, pi5]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ip-service

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: "Install dependencies"
        run: make install

      - name: "Format check"
        run: make qa

      - name: "Build"
        run: make docker-build
