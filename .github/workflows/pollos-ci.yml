name: "pollos.cz ci"

on:
  pull_request:
    paths:
      - 'pollos/**'
      - '.github/workflows/pollos-ci.yml'
  push:
    branches: [main]
    paths:
      - 'pollos/**'
      - '.github/workflows/pollos-ci.yml'
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pollos/microsite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: "Install JS deps"
        run: npm install --no-audit --no-fund

      - name: "Show tool versions"
        run: make version

      - name: "Lint (shellcheck + oxlint)"
        run: make lint

      - name: "Build static site"
        run: make build

      - name: "List build artifacts"
        run: find public -type f | sort

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pollos/infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: "Format check + validate"
        run: make ci

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pollos/microsite-ws
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: "Install JS deps"
        run: make install-ci

      - name: "Typecheck + format check"
        run: make ci