name: "pollos.cz ci"

on:
  pull_request:
    paths:
      - 'pollos/**'
      - '.github/workflows/pollos-ci.yml'
      - '!**/*.md'
  push:
    branches: [main]
    paths:
      - 'pollos/**'
      - '.github/workflows/pollos-ci.yml'
      - '!**/*.md'
  workflow_dispatch:

# A new push to the same PR cancels the run still going for the previous one.
# Everything else runs to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pollos/infra
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - name: "Format check + validate"
        run: make ci
      - name: "state.sh test"
        run: make test SHELLCHECK=shellcheck

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pollos/microsite-ws
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: "Install JS deps"
        run: make install-ci

      - name: "Typecheck + format check"
        run: make ci

  # The scan lives in landsman/config and is called, not copied — one place to
  # change the scanner, the image or a default pack for every repo of mine.
  # Its own job so a finding reads as a finding rather than as a broken build.
  security:
    uses: landsman/config/.github/workflows/semgrep.yml@main
    with:
      packs: p/secrets p/typescript p/terraform
      path: pollos
