name: "pollos.cz ci"

on:
  pull_request:
    paths:
      - 'pollos/**'
      - '.github/workflows/pollos-ci.yml'
  push:
    branches: [main]
    paths:
      - 'pollos/**'
      - '.github/workflows/pollos-ci.yml'
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pollos/microsite
    steps:
      - uses: actions/checkout@v4

      - name: "Show tool versions"
        run: make version

      - name: "Lint bash scripts"
        run: make lint

      - name: "Build static site"
        run: make build

      - name: "List build artifacts"
        run: find public -type f | sort