name: "pollos.cz ci"

on:
  pull_request:
    paths:
      - 'pollos/**'
      - '.github/workflows/pollos-ci.yml'
      - '!**/*.md'
  push:
    branches: [main]
    paths:
      - 'pollos/**'
      - '.github/workflows/pollos-ci.yml'
      - '!**/*.md'
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pollos/microsite
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: "Install JS deps"
        run: npm install --no-audit --no-fund

      - name: "Show tool versions"
        run: make version

      - name: "Lint (shellcheck + oxlint)"
        run: make lint

      - name: "Build static site"
        run: make build

      - name: "Run generator tests"
        run: make test

      - name: "List build artifacts"
        run: find public -type f | sort

  # Cloudflare builds no previews on its own — the Pages project is fed by
  # direct upload, not connected to git. So every PR uploads its build under
  # its branch name and links the alias back on the PR. Fork and Dependabot
  # PRs get no secrets, so they are skipped rather than failed.
  preview:
    needs: ci
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: pollos
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: "Build static site"
        run: make build
        working-directory: pollos/microsite
      - uses: cloudflare/wrangler-action@v4
        id: deploy
        with:
          apiToken: ${{ secrets.POLLOS_CZ_CF_API_TOKEN }}
          accountId: ${{ vars.POLLOS_CZ_CF_ACCOUNT_ID }}
          command: pages deploy pollos/microsite/public --project-name=pollos-cz --branch=${{ github.head_ref }}
      - name: "Link the preview on the PR"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
        run: 'gh pr comment "$PR" --edit-last --create-if-none --body "pollos.cz preview: $URL"'

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pollos/infra
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - name: "Format check + validate"
        run: make ci

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pollos/microsite-ws
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: "Install JS deps"
        run: make install-ci

      - name: "Typecheck + format check"
        run: make ci

  # The scan lives in landsman/config and is called, not copied — one place to
  # change the scanner, the image or a default pack for every repo of mine.
  # Its own job so a finding reads as a finding rather than as a broken build.
  security:
    uses: landsman/config/.github/workflows/semgrep.yml@main
    with:
      packs: p/secrets p/typescript p/terraform
      path: pollos
