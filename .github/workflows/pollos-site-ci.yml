name: "pollos.cz site"

# The site and its preview, only when what it is built from changes: the microsite and the setup scripts it serves
# (src/setup links to pollos/setup). Split from pollos-ci.yml, which runs on every pollos change, so an infra-only
# pull request no longer uploads a preview of an unchanged site and links it on the PR.
on:
  pull_request:
    paths:
      - 'pollos/microsite/**'
      - 'pollos/setup/**'
      - '.github/workflows/pollos-site-ci.yml'
      - '!**/*.md'
  push:
    branches: [main]
    paths:
      - 'pollos/microsite/**'
      - 'pollos/setup/**'
      - '.github/workflows/pollos-site-ci.yml'
      - '!**/*.md'
  workflow_dispatch:

# A new push to the same PR cancels the run still going for the previous one.
# Everything else runs to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pollos/microsite
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: "Install JS deps"
        run: npm install --no-audit --no-fund

      - name: "Show tool versions"
        run: make version

      - name: "Lint (shellcheck + oxlint)"
        run: make lint

      - name: "Format check (oxfmt)"
        run: make format-check

      - name: "Build static site"
        run: make build

      - name: "Run generator tests"
        run: make test

      - name: "List build artifacts"
        run: find public -type f | sort

  # Cloudflare builds no previews on its own — the Pages project is fed by
  # direct upload, not connected to git. So every PR uploads its build under
  # its branch name and links the alias back on the PR. Fork and Dependabot
  # PRs get no secrets, so they are skipped rather than failed.
  preview:
    needs: ci
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: pollos
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: "Build static site"
        run: make build
        working-directory: pollos/microsite
      # Wrangler is installed with Bun: the action picks it from the root bun.lock.
      - name: "Set up Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: cloudflare/wrangler-action@v4
        id: deploy
        with:
          apiToken: ${{ secrets.POLLOS_CZ_CF_API_TOKEN }}
          accountId: ${{ vars.POLLOS_CZ_CF_ACCOUNT_ID }}
          command: pages deploy pollos/microsite/public --project-name=pollos-cz --branch=${{ github.head_ref }}
      - name: "Link the preview on the PR"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
        run: 'gh pr comment "$PR" --edit-last --create-if-none --body "pollos.cz preview: $URL"'
