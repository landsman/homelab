name: "tailscale api check"

# Run by hand when a Tailscale resource fails to apply with nothing but a status: asks the API as the same OAuth
# client the apply uses and prints each call's status and Tailscale's own message. No body on success, no token.
on:
  workflow_dispatch:
  # Also on a pull request that changes the check, so a change to it is seen working before it reaches main,
  # where alone it can be run by hand.
  pull_request:
    paths:
      - 'pollos/infra/tailscale-api.sh'
      - '.github/workflows/tailscale-api-check.yml'

jobs:
  check:
    # Secrets are not given to a fork's pull request; skip rather than fail there.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: pollos
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: "Ask the API"
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.POLLOS_TAILSCALE_OAUTH_CLIENT_ID }}
          TS_OAUTH_CLIENT_SECRET: ${{ secrets.POLLOS_TAILSCALE_OAUTH_CLIENT_SECRET }}
        run: pollos/infra/tailscale-api.sh check
