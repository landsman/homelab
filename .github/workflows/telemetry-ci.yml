name: "telemetry ci"

on:
  pull_request:
    paths:
      - 'telemetry/infra/**'
      - 'telemetry/host/**'
      - '.github/workflows/telemetry-ci.yml'
      - '!**/*.md'
  push:
    branches: [main]
    paths:
      - 'telemetry/infra/**'
      - 'telemetry/host/**'
      - '.github/workflows/telemetry-ci.yml'
      - '!**/*.md'
  workflow_dispatch:

jobs:
  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telemetry/infra
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - name: "Format check + validate"
        run: make ci

  host:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telemetry
    steps:
      - uses: actions/checkout@v7
      - name: "shellcheck"
        run: make lint
      - name: "cmdline.txt edit"
        run: make test

  # The scan lives in landsman/config and is called, not copied — one place to
  # change the scanner, the image or a default pack for every repo of mine.
  # Its own job so a finding reads as a finding rather than as a broken build.
  security:
    uses: landsman/config/.github/workflows/semgrep.yml@main
    with:
      packs: p/secrets p/terraform
      path: telemetry
