name: Deploy telemetry

on:
  push:
    branches: [main]
    paths:
      - 'telemetry/infra/**'
      - '.github/workflows/telemetry-deploy.yml'
      - '!**/*.md'
  workflow_dispatch:

jobs:
  infra:
    runs-on: ubuntu-latest
    # insuit's environment: the state shares its R2 bucket (see infra/main.tf)
    environment: production
    defaults:
      run:
        working-directory: telemetry/infra
    env:
      TF_VAR_cloudflare_api_token: ${{ secrets.CF_ACCESS_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.INSUIT_CZ_CF_ACCOUNT_ID }}
      TF_VAR_access_email: ${{ secrets.CF_ACCESS_EMAIL }}
      TF_VAR_home_ip_ranges: ${{ secrets.HOME_IP_RANGES }}
      TF_VAR_grafana_hostname: ${{ vars.GRAFANA_HOSTNAME }}
      AWS_ACCESS_KEY_ID: ${{ secrets.INSUIT_CZ_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.INSUIT_CZ_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform init -backend-config="endpoints={s3=\"https://${{ vars.INSUIT_CZ_CF_ACCOUNT_ID }}.r2.cloudflarestorage.com\"}"
      - run: terraform apply -auto-approve
