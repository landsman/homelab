name: Deploy telemetry

on:
  push:
    branches: [main]
    paths:
      - 'telemetry/infra/**'
      - '.github/workflows/telemetry-deploy.yml'
      - '!**/*.md'
  workflow_dispatch:

jobs:
  infra:
    runs-on: ubuntu-latest
    environment: telemetry
    defaults:
      run:
        working-directory: telemetry/infra
    env:
      TF_VAR_cloudflare_api_token: ${{ secrets.TELEMETRY_CF_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.TELEMETRY_CF_ACCOUNT_ID }}
      TF_VAR_access_email: ${{ secrets.TELEMETRY_ACCESS_EMAIL }}
      TF_VAR_home_ip_ranges: ${{ secrets.TELEMETRY_HOME_IP_RANGES }}
      TF_VAR_grafana_hostname: ${{ vars.TELEMETRY_GRAFANA_HOSTNAME }}
      # State lives in telemetry's own R2 bucket, with a token scoped to it.
      AWS_ACCESS_KEY_ID: ${{ secrets.TELEMETRY_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TELEMETRY_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform init -backend-config="endpoints={s3=\"https://${{ vars.TELEMETRY_CF_ACCOUNT_ID }}.r2.cloudflarestorage.com\"}"
      - run: terraform apply -auto-approve
