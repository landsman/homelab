services:
  # Its own tailnet node, tag:authelia, like forgejo-mcp's: my devices sign in
  # here in a browser, and forgejo-mcp fetches the key set. No port on the Pi.
  tailscale:
    image: tailscale/tailscale:v1.104.2
    container_name: authelia-tailscale
    hostname: auth
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: auth
      TS_USERSPACE: 'true'
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro

  authelia:
    image: ghcr.io/authelia/authelia:4.39.28
    container_name: authelia
    restart: unless-stopped
    environment:
      X_AUTHELIA_CONFIG_FILTERS: template
      AUTH_HOST: ${AUTH_HOST:?copy .env.example to .env}
      FORGEJO_MCP_HOST: ${FORGEJO_MCP_HOST:?copy .env.example to .env}
      # Generated on the box by `make secrets`, never printed.
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /secrets/jwt
      AUTHELIA_SESSION_SECRET_FILE: /secrets/session
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /secrets/storage
      AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE: /secrets/oidc-hmac
    volumes:
      - ./configuration.yml:/config/configuration.yml:ro
      - ./users.yml:/config/users.yml:ro
      - ./secrets:/secrets:ro
      - data:/data
    network_mode: service:tailscale
    depends_on:
      - tailscale

volumes:
  tailscale:
  # Named, so `make backup` finds it whatever folder the stack runs from.
  data:
    name: authelia_data
