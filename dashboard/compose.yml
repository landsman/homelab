services:
  web:
    image: ${REGISTRY_IMAGE:-homelab-dashboard}:${TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - '8080:80'
    environment:
      # Runtime subpath the SPA is mounted at. '/' = root. Set e.g.
      # '/dashboard/' (trailing slash required) when fronted by tailscale
      # serve --set-path=/dashboard. Same image, no rebuild needed.
      BASE_PATH: ${BASE_PATH:-/}
    restart: unless-stopped
