server {
    # 8080, not 80: the container runs as a non-root user (docker/Dockerfile).
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy: bypass CORS for upstream APIs.
    # Client requests these at ${BASE_PATH}proxy/... ; an upstream proxy
    # (tailscale serve, cloudflare tunnel) must strip the base prefix before
    # it reaches nginx, OR set BASE_PATH=/ for that container.
    # Using a variable in proxy_pass defers DNS resolution to request time,
    # so nginx doesn't fail to start if an upstream is temporarily unresolvable.
    resolver 1.1.1.1 8.8.8.8 valid=60s ipv6=off;
    resolver_timeout 5s;

    location /proxy/status-codeberg-org/ {
        set $upstream_codeberg "status.codeberg.org";
        proxy_pass https://$upstream_codeberg/;
        proxy_ssl_server_name on;
        proxy_set_header Host $upstream_codeberg;
    }

    location /proxy/slack-status-com/ {
        set $upstream_slack "slack-status.com";
        proxy_pass https://$upstream_slack/;
        proxy_ssl_server_name on;
        proxy_set_header Host $upstream_slack;
    }

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
