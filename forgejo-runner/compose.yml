services:
  runner:
    image: code.forgejo.org/forgejo/runner:13.2.1
    container_name: forgejo-runner
    restart: unless-stopped
    user: "1001:${DOCKER_GID:?run 'make prepare' on the box first}"
    volumes:
      - ./data:/data
      - ./runner/config.yml:/data/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # Fetches the mirrored actions over the tailnet when FORGEJO_INTERNAL_URL is
      # set, and passes everything through when it is not. README: "Fetching
      # actions over the tailnet".
      - ./runner/git:/usr/local/bin/git:ro
    environment:
      FORGEJO_INTERNAL_URL: "${FORGEJO_INTERNAL_URL:-}"
    command: forgejo-runner daemon --config /data/config.yml

  # Prunes unused Docker data after a job when the disk is under 40 % free. README: "Disk".
  cleanup:
    image: docker:29.9.2-cli@sha256:5e6baf67325a79f64ed3bed6863954d5e05d0f3d4e57cbdb14809346814bbfdb
    container_name: forgejo-runner-cleanup
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Only to measure the disk Docker writes to; nothing is written through it.
      - /var/lib/docker:/var/lib/docker:ro
      - ./cleanup.sh:/usr/local/bin/cleanup.sh:ro
    environment:
      MIN_FREE: "${CLEANUP_MIN_FREE:-40}"
    command: cleanup.sh loop
