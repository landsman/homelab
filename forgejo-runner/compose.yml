services:
  runner:
    image: code.forgejo.org/forgejo/runner:13
    container_name: forgejo-runner
    restart: unless-stopped
    user: "1001:${DOCKER_GID:?run 'make prepare' on the box first}"
    volumes:
      - ./data:/data
      - ./runner/config.yml:/data/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # Fetches actions over the LAN when FORGEJO_INTERNAL_URL is set, and passes
      # everything through when it is not. README: "Fetching actions over the LAN".
      - ./runner/git:/usr/local/bin/git:ro
    environment:
      FORGEJO_INTERNAL_URL: "${FORGEJO_INTERNAL_URL:-}"
    command: forgejo-runner daemon --config /data/config.yml
