log:
  level: info

runner:
  capacity: 2
  timeout: 3h
  shutdown_timeout: 30s
  labels:
    - "ubuntu-latest:docker://docker.gitea.com/runner-images:ubuntu-22.04"
    - "self-hosted:host"

cache:
  enabled: true
  dir: /data/cache

container:
  # Caches kept between jobs, because a job container is fresh every run:
  #   mise    the JDK (173 MB), shellcheck, oxipng
  #   gradle  the dependency cache and the build cache
  #
  # The *host* daemon resolves these, so the left side is a path on this box and
  # not one inside the runner container. `make prepare` creates them, and warns
  # if the runner is checked out somewhere other than the path below.
  # Why these and not actions/cache: ../README.md
  options: >-
    --volume /home/ansible/forgejo-runner/cache/mise:/root/.local/share/mise
    --volume /home/ansible/forgejo-runner/cache/gradle:/root/.gradle

  docker_host: 'automount'
  privileged: false
  force_pull: true
  # This gates `options` above as well, which is not obvious and fails in the
  # quietest way there is: a volume not matched here is dropped from the job
  # container with no error, no warning and nothing in the runner log. The caches
  # looked configured and stayed empty across 36 jobs before anyone checked.
  #
  # `docker inspect <job-container>` is how you tell — if a mount is not in that
  # list, it was filtered here.
  valid_volumes:
    - /data/**
    - /home/ansible/forgejo-runner/cache/**

server:
  connections:
    forgejo:
      url: 'https://git.insuit.cz/'
      uuid: '<UUID from Forgejo UI>'
      token: '<TOKEN from Forgejo UI>'
