services:
  # app, gui
  forgejo:
    image: codeberg.org/forgejo/forgejo:16.0.6
    container_name: forgejo
    restart: unless-stopped
    environment:
      USER_UID: 1000
      USER_GID: 1000
      FORGEJO__server__ROOT_URL: ${FORGEJO_URL}
      FORGEJO__server__SSH_DOMAIN: ${FORGEJO_SSH_DOMAIN}
      FORGEJO__service__SSH_PORT: ${FORGEJO_SSH_PORT}
      # [repository.pull-request] — `_0X2E_` is the dot, `_0X2D_` the hyphen, which an environment
      # variable name cannot carry. Read when a repository is created only: merge-style.sh does the
      # existing ones, and turns the merge commit off, which no setting here can.
      FORGEJO__repository_0X2E_pull_0X2D_request__DEFAULT_MERGE_STYLE: squash
      # forgejo-mcp's issuer is a tailnet name, 100.64/10, which Forgejo refuses by default.
      # Listing it replaces that default for every Authorized Integration on the instance:
      # only issuers named here are allowed. Empty keeps the default (public addresses only).
      FORGEJO__authorized_integration__ALLOWED_DOMAINS: ${FORGEJO_MCP_HOST:-}
    networks:
      - forgejo
    ports:
      - '3000:3000'
      - '${FORGEJO_SSH_PORT}:22'
    volumes:
      - forgejo:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

volumes:
  forgejo:
    external: true
    name: forgejo_forgejo

networks:
  forgejo:
    external: false
