services:
  # app, gui
  forgejo:
    image: codeberg.org/forgejo/forgejo:16
    container_name: forgejo
    restart: unless-stopped
    environment:
      USER_UID: 1000
      USER_GID: 1000
      FORGEJO__server__ROOT_URL: ${FORGEJO_URL}
      FORGEJO__server__SSH_DOMAIN: ${FORGEJO_SSH_DOMAIN}
      FORGEJO__service__SSH_PORT: ${FORGEJO_SSH_PORT}
    networks:
      - forgejo
    ports:
      - '3000:3000'
      - '${FORGEJO_SSH_PORT}:22'
    volumes:
      - forgejo:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

volumes:
  forgejo:
    external: true
    name: forgejo_forgejo

networks:
  forgejo:
    external: false
