# GTM and GA4 for insuit.cz, as code. How CI plans and applies it, and the
# accounts it needs: ../.github/actions/gtm/README.md
version: 1

project:
  name: insuit-cz

google:
  gtm:
    accountId: '${GTM_ACCOUNT_ID}'
    containerId: '${GTM_CONTAINER_ID}'

  ga4:
    propertyId: '${GA4_PROPERTY_ID}'

events: {}

gtm:
  variables: {}
  triggers: {}
  tags: {}

ga4:
  dimensions: {}
  metrics: {}
  keyEvents: {}
