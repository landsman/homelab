<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Two-tone disc: the theme-toggle motif, and the only shape that stays
       visible on both a light and a dark browser tab bar. Static here; the
       animated version is drawn by /favicon.js. -->
