<html lang="cs" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Los Pollos Hermanos</title>
    <meta name="description" content="Los Pollos Hermanos (Spanish pronunciation: [los ˌpoʝos eɾˈmanos]; lit. 'The Chicken Brothers') — family-owned fast-food fried chicken restaurant chain founded by Gustavo Fring, with locations across New Mexico and the American Southwest. A taste of family." />

    <meta name="robots" content="notranslate" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.pollos.cz/" />
    <meta property="og:title" content="Los Pollos Hermanos" />
    <meta property="og:description" content="Los Pollos Hermanos (Spanish pronunciation: [los ˌpoʝos eɾˈmanos]; lit. 'The Chicken Brothers') — family-owned fast-food fried chicken restaurant chain founded by Gustavo Fring, with locations across New Mexico and the American Southwest. A taste of family." />
    <meta property="og:image" content="https://www.pollos.cz/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Los Pollos Hermanos" />
    <meta name="twitter:description" content="Los Pollos Hermanos (Spanish pronunciation: [los ˌpoʝos eɾˈmanos]; lit. 'The Chicken Brothers') — family-owned fast-food fried chicken restaurant chain founded by Gustavo Fring, with locations across New Mexico and the American Southwest. A taste of family." />
    <meta name="twitter:image" content="https://www.pollos.cz/og-image.png" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
      }
      html {
        background: #ce0f2e;
      }
      body {
        background: #fddb00;
        border-radius: 24px;
        margin: 10px;
        min-height: calc(100vh - 20px);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      img {
        width: 300px;
        max-width: 60vw;
        height: auto;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <img src="logo.png" alt="Click to play!" title="Click to play!" id="logo" />
    <div
      id="yt"
      style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none"
    ></div>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
      const logo = document.getElementById('logo');
      const animation = logo.animate(
        [{ transform: 'rotate(0deg)' }, { transform: 'rotate(360deg)' }],
        { duration: 2000, iterations: Infinity }
      );
      animation.playbackRate = 0;

      let player = null;
      let playerReady = false;
      window.onYouTubeIframeAPIReady = () => {
        player = new YT.Player('yt', {
          videoId: 'HHF0xlf-bjY',
          playerVars: { playsinline: 1, controls: 0 },
          events: {
            onReady: () => {
              playerReady = true;
            },
          },
        });
      };

      let started = false;
      logo.addEventListener('click', () => {
        animation.playbackRate += 1;
        if (!started && playerReady) {
          player.unMute();
          player.setVolume(100);
          player.playVideo();
          started = true;
        }
      });

      let last = performance.now();
      function decay(now) {
        const dt = (now - last) / 1000;
        last = now;
        if (animation.playbackRate > 0) {
          animation.playbackRate = Math.max(
            0,
            animation.playbackRate - dt * 0.5
          );
        }
        requestAnimationFrame(decay);
      }
      requestAnimationFrame(decay);
    </script>
  </body>
</html>
