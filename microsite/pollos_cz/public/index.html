    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
      }
      html {
        background: #ce0f2e;
      }
      body {
        background: #fddb00;
        border-radius: 24px;
        margin: 10px;
        min-height: calc(100vh - 20px);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      img {
        width: 300px;
        max-width: 60vw;
        height: auto;
        cursor: pointer;
        will-change: transform;
        transform: translateZ(0);
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }
      @media (max-width: 768px) {
        body {
          margin: 0;
          border-radius: 0;
          min-height: 100vh;
        }
      }
    </style>
  </head>
  <body>
    <img src="logo.png" alt="Click to play!" title="Click to play!" id="logo" />
    <div
      id="yt"
      style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none"
    ></div>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
      const logo = document.getElementById('logo');

      let player = null;
      let playerReady = false;
      window.onYouTubeIframeAPIReady = () => {
        player = new YT.Player('yt', {
          videoId: 'HHF0xlf-bjY',
          playerVars: { playsinline: 1, controls: 0 },
          events: {
            onReady: () => {
              playerReady = true;
            },
          },
        });
      };

      let angle = 0;
      let rate = 0;
      let tilt = 0;
      let started = false;
      let gyroEnabled = false;

      async function enableGyro() {
        if (gyroEnabled) return;
        if (typeof DeviceOrientationEvent !== 'undefined' &&
            typeof DeviceOrientationEvent.requestPermission === 'function') {
          try {
            const r = await DeviceOrientationEvent.requestPermission();
            if (r !== 'granted') return;
          } catch { return; }
        }
        window.addEventListener('deviceorientation', (e) => {
          tilt = e.gamma || 0;
        });
        gyroEnabled = true;
      }

      logo.addEventListener('click', () => {
        rate += 360;
        enableGyro();
        if (!started && playerReady) {
          player.unMute();
          player.setVolume(100);
          player.playVideo();
          started = true;
        }
      });

      let last = performance.now();
      function tick(now) {
        const dt = (now - last) / 1000;
        last = now;
        rate += Math.abs(tilt) * 15 * dt;
        rate = Math.max(0, rate - dt * 180);
        if (rate > 0.1) {
          angle = (angle + rate * dt * Math.sign(tilt || 1)) % 360;
          logo.style.transform = `translateZ(0) rotate(${angle}deg)`;
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    </script>
  </body>
</html>
