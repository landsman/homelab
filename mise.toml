# The CLI tools the whole repo shares; a folder's own mise.toml adds what only it needs.
[settings]
experimental = true # for [hooks]
# Bun's version is read from `packageManager` in the nearest package.json, the pin CI's setup-bun
# and Dependabot already use, so there is no second one to drift. insuit and ip-service keep their own.
idiomatic_version_file_enable_tools = ["bun"]

[tools]
terraform = "1.17.1"
shellcheck = "0.11.0"
# node for npm:wrangler, which mise installs with npm.
node = "22"
"npm:wrangler" = "4.94.0"

# mise checks node's signature with gpg; without the release keys imported the install fails.
[hooks]
preinstall = """
echo "resetting gpg agent + importing Node release keys..."
gpgconf --kill all 2>/dev/null || true
KEYS=$(curl -fsSL https://raw.githubusercontent.com/nodejs/release-keys/main/keys.list)
for server in keys.openpgp.org keyserver.ubuntu.com pgp.mit.edu; do
  echo "$KEYS" | xargs gpg --keyserver hkps://$server --recv-keys && break
done
"""
