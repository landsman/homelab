<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>{{TITLE}}</title>
    <meta
      name="description"
      content="Los Pollos Hermanos (Spanish pronunciation: [los ˌpoʝos eɾˈmanos]; lit. 'The Chicken Brothers') — family-owned fast-food fried chicken restaurant chain founded by Gustavo Fring, with locations across New Mexico and the American Southwest. A taste of family."
    />
    <meta name="google" content="notranslate" />
    <meta name="robots" content="noindex" />

    <link rel="icon" href="/assets/img/favicon/favicon.ico?v={{ASSET_VERSION}}" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/img/favicon/favicon-16.png?v={{ASSET_VERSION}}"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/img/favicon/favicon-32.png?v={{ASSET_VERSION}}"
    />
    <link
      rel="apple-touch-icon"
      href="/assets/img/favicon/apple-touch-icon.png?v={{ASSET_VERSION}}"
    />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.pollos.cz/" />
    <meta property="og:title" content="{{TITLE}}" />
    <meta
      property="og:description"
      content="Los Pollos Hermanos (Spanish pronunciation: [los ˌpoʝos eɾˈmanos]; lit. 'The Chicken Brothers') — family-owned fast-food fried chicken restaurant chain founded by Gustavo Fring, with locations across New Mexico and the American Southwest. A taste of family."
    />
    <meta property="og:image" content="https://www.pollos.cz/assets/img/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{TITLE}}" />
    <meta
      name="twitter:description"
      content="Los Pollos Hermanos (Spanish pronunciation: [los ˌpoʝos eɾˈmanos]; lit. 'The Chicken Brothers') — family-owned fast-food fried chicken restaurant chain founded by Gustavo Fring, with locations across New Mexico and the American Southwest. A taste of family."
    />
    <meta name="twitter:image" content="https://www.pollos.cz/assets/img/og-image.png" />

    <link rel="stylesheet" href="/assets/style.css?v={{ASSET_VERSION}}" />
  </head>
  <body
    hx-boost="true"
    hx-target="#page"
    hx-select="#page"
    hx-swap="outerHTML scroll:body:top show:window:top transition:true"
  >
    <div id="page" hx-history-elt>{{CONTENT}}</div>

    <div
      id="yt"
      style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none"
    ></div>

    <button id="mini-player" type="button" aria-label="Play music" hidden>
      <span class="icon-play" aria-hidden="true"></span>
      <span class="icon-pause" aria-hidden="true"></span>
    </button>

    <script defer src="/assets/vendor/htmx-2.0.4.min.js"></script>
    <script defer src="/assets/app.js?v={{ASSET_VERSION}}"></script>
    <script defer src="/assets/cursors.js?v={{ASSET_VERSION}}"></script>
    <!-- YouTube IFrame API is injected lazily by app.js on first play intent.
         Loading it here delayed first paint by ~1s (the cross-origin embed
         blocks the main document's first render) for no benefit — audio only
         ever starts on a user click. -->
  </body>
</html>
