# Written for rootless Docker, as the Pi runs it (docker/README.md): no docker0
# on the host, the socket in $XDG_RUNTIME_DIR, container root = the host user.
# Host metrics come from node-exporter on each host, see host/.

services:
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prometheus
    restart: unless-stopped
    # no auth and an open OTLP receiver, so loopback only; apps on the Pi push
    # from inside the telemetry network instead (see README)
    ports:
      - "127.0.0.1:3210:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=10GB"
      - "--web.enable-otlp-receiver"

  # per-container CPU, memory and network from the Docker stats API. cAdvisor
  # reads host cgroups instead, and under rootless it crashes on other users'
  # slices (google/cadvisor#3728)
  telegraf:
    image: telegraf:1.40.1
    container_name: telegraf
    restart: unless-stopped
    # the image's entrypoint drops to a telegraf user, which cannot open the
    # socket; root here is the host user that owns it
    entrypoint: ["telegraf"]
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - ${DOCKER_SOCKET:-${XDG_RUNTIME_DIR:?run from a login shell of the Docker user}/docker.sock}:/var/run/docker.sock:ro

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    container_name: blackbox-exporter
    restart: unless-stopped
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro

  loki:
    image: grafana/loki:3.7.8
    container_name: loki
    restart: unless-stopped
    # no auth, anyone who reaches it reads every log; loopback only, as prometheus
    ports:
      - "127.0.0.1:3215:3100"
    volumes:
      - ./loki/loki.yml:/etc/loki/local-config.yaml:ro
      - loki:/loki

  alloy:
    image: grafana/alloy:v1.20.0
    container_name: alloy
    restart: unless-stopped
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ${DOCKER_SOCKET:-${XDG_RUNTIME_DIR:?run from a login shell of the Docker user}/docker.sock}:/var/run/docker.sock:ro
      # read positions; without them a recreated container re-ships every log file
      - alloy:/var/lib/alloy/data
    command:
      - "run"
      - "--disable-reporting"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:13.2.2
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3211:3000"
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    # any other GF_* in .env, such as GF_SERVER_ROOT_URL
    env_file: .env
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:?set it in .env}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?set it in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/homelab.json
    depends_on:
      - prometheus
      - loki

# named, so apps in other compose projects can join it and push OTLP
networks:
  default:
    name: telemetry

# named volumes live under Docker's data-root (the RAID, not the SD card), and
# Docker copies each image's directory ownership into a new one: no chown
volumes:
  prometheus:
  loki:
  alloy:
  grafana:
