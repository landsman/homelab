[agent]
  interval = "15s"
  omit_hostname = true

[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  # totals only: per-CPU and per-device series add nothing on one Pi
  perdevice_include = []
  total_include = ["cpu", "blkio", "network"]
  docker_label_include = ["com.docker.compose.project"]

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
