services:
  whisper:
    build: .
    image: whisper:latest
    container_name: whisper
    command: -m /models/ggml-large-v3-turbo-q8_0.bin --host 0.0.0.0 --port 8004 --convert -l auto
    ports:
      - "127.0.0.1:8004:8004"
    volumes:
      - ./models:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8004/health"]
      interval: 30s
      start_period: 60s
    restart: "no"
