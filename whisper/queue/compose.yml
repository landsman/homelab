# Local dev / debugging stack for the whisper-queue coordinator.
# Brings up Postgres (queue state) + Adminer (DB browser). Run the coordinator
# locally against it:
#   DB: postgres://postgres:postgres@127.0.0.1:5432/whisper_queue
# The production coordinator/worker services + profiles get added here later
# (see PLAN.md → Deployment); for now this is just the database for dev.
services:
  postgres:
    image: postgres:18
    container_name: whisper-queue-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: whisper_queue
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - queue-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d whisper_queue"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: dockette/adminer:dg
    container_name: whisper-queue-adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:80"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
      - ADMINER_DEFAULT_SYSTEM=postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  queue-db:
